<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Executivo · Checklist Interativo</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; line-height: 1.5; }

    /* Header e Progresso */
    header { background-color: #fff; border-bottom: 1px solid var(--border); padding: 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .header-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .header-title h1 { font-size: 1.5rem; color: var(--primary); font-weight: 700; }
    .header-title p { font-size: 0.9rem; color: var(--text-muted); }

    .progress-box { display: flex; align-items: center; gap: 15px; background: #f1f5f9; padding: 10px 18px; border-radius: var(--radius); }
    .progress-bar-bg { width: 120px; height: 10px; background: #cbd5e1; border-radius: 5px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--success); transition: width 0.3s ease; }
    .progress-text { font-weight: 700; font-size: 1.1rem; color: var(--primary); }
    .progress-subtext { font-size: 0.8rem; color: var(--text-muted); }

    /* Controls & Navigation */
    main { max-width: 1100px; margin: 25px auto; padding: 0 15px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .btn-action { background: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text); transition: all 0.2s; }
    .btn-action:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .btn-danger { color: #ef4444; }
    .btn-danger:hover { background: #fef2f2; }

    /* Grid e Cards Flip */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; perspective: 1000px; }
    .card-container { height: 480px; position: relative; }
    .card { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .card.flipped { transform: rotateY(180deg); }

    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius); background: var(--card-bg); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; overflow: hidden; }
    
    /* Frente do Card */
    .card-front { justify-content: space-between; padding: 25px; text-align: center; }
    .card-front-content { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; }
    .card-step-badge { background: #e0e7ff; color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; }
    .card-front h3 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }
    .card-front p { font-size: 0.9rem; color: var(--text-muted); }
    .btn-flip { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn-flip:hover { background: var(--primary-light); }

    /* Verso do Card */
    .card-back { transform: rotateY(180deg); }
    .card-back-header { padding: 15px; background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .btn-back { background: transparent; border: none; color: var(--primary-light); font-weight: 700; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 4px; }
    .card-back-title { font-weight: 700; font-size: 0.95rem; }
    .card-back-body { padding: 15px; overflow-y: auto; flex-grow: 1; }

    /* Checklist Items */
    .checklist-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #f1f5f9; font-size: 0.88rem; }
    .checklist-item:last-child { border-bottom: none; }
    .checklist-item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
    .checklist-item label { cursor: pointer; color: #334155; flex-grow: 1; }
    .checklist-item input:checked + label { text-decoration: line-through; color: #94a3b8; }

    /* Paginação */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 30px; }
    .btn-page { background: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }

    footer { text-align: center; margin-top: 40px; color: var(--text-muted); font-size: 0.85rem; }

    /* Print Styles */
    @media print {
      header, .top-bar, .pagination, .btn-flip, .btn-back, footer { display: none !important; }
      body { background: #fff; color: #000; }
      .cards-grid { display: block; }
      .card-container { height: auto; page-break-inside: avoid; margin-bottom: 30px; position: static; }
      .card { transform: none !important; position: static; height: auto; }
      .card-front { display: none; }
      .card-back { transform: none; position: static; height: auto; border: 1px solid #000; }
      .card-back-body { overflow: visible; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="header-title">
        <h1>Projeto Executivo</h1>
        <p>Acompanhamento e checklist de entregáveis em sala de aula</p>
      </div>
      <div class="progress-box">
        <div>
          <div class="progress-text"><span id="completed-count">0</span>/105</div>
          <div class="progress-subtext">Itens marcados</div>
        </div>
        <div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
          <div class="progress-subtext" id="percentage-text" style="text-align: right; margin-top: 4px;">0%</div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="top-bar">
      <div>
        <h2 id="page-title">Etapas 1–3</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Escolha um card para consultar o checklist no verso e marque os itens.</p>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-action" onclick="window.print()">🖨️ Imprimir checklist</button>
        <button class="btn-action btn-danger" onclick="resetChecklist()">🗑️ Limpar tudo</button>
      </div>
    </div>

    <div class="cards-grid" id="cards-container"></div>

    <div class="pagination">
      <button class="btn-page" id="btn-prev" onclick="changePage(-1)">← Anterior</button>
      <span id="page-indicator" style="font-size: 0.9rem; font-weight: 600;">Página 1 de 3</span>
      <button class="btn-page" id="btn-next" onclick="changePage(1)">Próxima →</button>
    </div>
  </main>

  <footer>
    As marcações ficam salvas automaticamente neste navegador.
  </footer>

  <script>
    const stages = [
      {
        page: 1, id: 1, title: "Etapa 01 · Visão Geral do Projeto Executivo", items: [
          "Planta de Implantação",
          "Planta Baixa de todos os pavimentos (preferencialmente em escala de 1/50 salvo exceções)",
          "Planta de Layout",
          "Planta de Cobertura",
          "Cortes (mínimo de 04 cortes para a edificação)",
          "Fachadas (TODAS)",
          "Planta com definição de pontos elétricos",
          "Planta de Forro",
          "Maquete Eletrônica"
        ]
      },
      {
        page: 1, id: 2, title: "Etapa 02 · Planta de Implantação", items: [
          "Indicação do norte.",
          "Cotas gerais do terreno.",
          "Amarração das construções (hachuradas) no lote.",
          "Indicação dos nomes das ruas.",
          "Indicação do quadro de áreas.",
          "Indicação da localização da vegetação arbórea.",
          "Indicação do título e escala dos desenhos."
        ]
      },
      {
        page: 1, id: 3, title: "Etapa 03 · Planta Baixa", items: [
          "Indicação do norte.",
          "Nome, área e níveis dos ambientes. Os níveis deverão indicar o nível 0,00 de referência.",
          "Diferenciação de afastamento pelas espessuras das linhas (hierarquia de traços).",
          "Quadro de esquadria na planta baixa com dimensões e peitoril. Verificar portas de madeira externas.",
          "Verificar se as Janelas e Portas possuem o mesmo alinhamento superior nas fachadas.",
          "Inserir na descrição do Quadro de Esquadrias a cor, tipo, e especificação do vidro.",
          "Indicação das cotas de amarração de todas as esquadrias (mínimo 10 cm nas bonecas).",
          "Indicação de título do desenho e escala na prancha.",
          "Indicação das elevações do projeto (04 elevações).",
          "Indicação das linhas de corte (Mínimo de 04 cortes bem distribuídos).",
          "Padronização de textos e cotas compatíveis com a escala dos desenhos.",
          "Indicação das cotas parciais e totais das edificações.",
          "Indicação das cotas do eixo de todos os equipamentos hidrossanitários.",
          "Indicação das cotas (transversais e longitudinais) de todas as bancadas.",
          "Detalhamento de ambientes complexos em escala adequada quando acima de 1/50.",
          "Indicação na Planta Baixa das dimensões dos painéis de vidro.",
          "Indicação na Planta Baixa dos elementos vazados e altura dos mesmos.",
          "Indicação das aberturas (vãos) em Pórticos/Paredes (largura, altura e peitoril).",
          "Indicação dos sentidos de subida e descida das escadas e rampas (com inclinação).",
          "Número dos degraus da escada e cota de pisos.",
          "Indicação de altura de guarda-corpo e corrimão das escadas e rampas.",
          "Indicação dos gradis e altura dos mesmos quando existirem.",
          "Indicação da calçada ao redor da edificação (evitar paredes em contato direto com a grama).",
          "Indicação das projeções da cobertura e elementos significativos (mezanino, marquise, pergolado).",
          "Indicar projeção do alçapão para manutenção dos reservatórios.",
          "Indicação da localização da casa de gás.",
          "Indicar se os sanitários utilizam válvula hidra ou caixa acoplada.",
          "Inserir o Quadro de Louças com quantitativo das peças para orçamento.",
          "Inserir o Quadro de Bancadas contendo material e dimensões.",
          "Verificar a incidência solar e prever elementos de proteção (brises, painéis de vidro ao oeste).",
          "Verificar ventilação/iluminação (esquadrias suficientes ou exaustor / NORMA DE DESEMPENHO).",
          "Locação de ralo nas áreas molhadas com cota de amarração."
        ]
      },
      {
        page: 2, id: 4, title: "Etapa 04 · Cortes", items: [
          "Indicação dos nomes dos ambientes.",
          "Títulos e escalas do desenho (mesma escala da Planta Baixa).",
          "Textos e cotas compatíveis com a escala do desenho.",
          "Desenvolvimento de no mínimo 04 cortes da edificação.",
          "Diferenciação de afastamento pelas espessuras das linhas (hierarquia de traços).",
          "Indicação de elementos técnicos com linhas de chamada.",
          "Indicação de níveis e patamares.",
          "Cotas verticais, parciais e totais de todos os ambientes.",
          "Cotas de todas as esquadrias, bancadas, elementos vazados e gradis.",
          "Representar volume do reservatório com espaço de manutenção (mínimo 60 cm perimetral).",
          "Verificar inclusão de vigas aéreas, baldrames e sapatas nos cortes.",
          "Vigas de bordo das varandas com cota de fundo ao menos 7 cm rebaixada que o forro."
        ]
      },
      {
        page: 2, id: 5, title: "Etapa 05 · Planta de Pontos Elétricos", items: [
          "Títulos e escalas do desenho.",
          "Indicação do nome e área dos ambientes.",
          "Textos e cotas compatíveis com a escala.",
          "Padronização dos tamanhos dos textos de legenda das luminárias.",
          "Indicação de todos os pontos de TOMADAS, INTERRUPTORES E ILUMINAÇÃO.",
          "Legenda com pontos diferenciados por cores (piso, parede, teto)."
        ]
      },
      {
        page: 2, id: 6, title: "Etapa 06 · Fachadas", items: [
          "Indicação de todas as fachadas/elevações.",
          "Títulos e escalas do desenho (mesma escala da Planta Baixa).",
          "Tamanho dos textos e cotas compatíveis com a escala.",
          "Diferenciação de afastamento por espessura de linhas (hierarquia de traços).",
          "Hachuras indicando a diferença dos acabamentos e revestimentos.",
          "Especificação do tipo de materiais em todas as faces das fachadas.",
          "Identificar com linhas de chamada todos os elementos construtivos aparentes.",
          "Não cruzar linhas de chamada no desenho.",
          "Indicação padronizada das linhas de chamada (alinhadas à esquerda/direita)."
        ]
      },
      {
        page: 3, id: 7, title: "Etapa 07 · Planta de Cobertura", items: [
          "Indicação do norte.",
          "Cotas parciais e totais das paredes e projeções.",
          "Indicação das linhas de corte.",
          "Títulos e escalas do desenho.",
          "Indicação das vistas.",
          "Diferenciação por espessura de linhas (hierarquia de traços).",
          "Compatibilidade de textos e cotas.",
          "Indicação das caídas do telhado, tipo de telha e inclinação (especificação do fabricante).",
          "Projeção e capacidade do volume do reservatório.",
          "Cotas de amarração do reservatório e acesso de manutenção.",
          "Tipo e altura da Platibanda (alvenaria, placa cimentícia, etc.).",
          "Locação e indicação do alçapão de manutenção.",
          "Indicação de pingadeiras, calhas, rufos e demais elementos de escoamento.",
          "Textos informativos para elementos não integrantes da cobertura (elemento vazado, gradil).",
          "Indicar cobertura da casa de gás quando houver.",
          "Localização do cavalete de água e entrada de energia.",
          "Indicação de acesso de veículos e pedestres com setas e textos."
        ]
      },
      {
        page: 3, id: 8, title: "Etapa 08 · Planta Layout", items: [
          "Indicação do nome e área dos ambientes.",
          "Indicação do norte.",
          "Tamanho dos textos e cotas compatíveis.",
          "Indicação do mobiliário e equipamentos elétricos (TV, fogão, geladeira, coifas, etc.).",
          "Indicar em projeção as máquinas de ar-condicionado nos ambientes.",
          "Títulos e escalas do desenho."
        ]
      },
      {
        page: 3, id: 9, title: "Etapa 09 · Planta de Forro", items: [
          "Títulos e escalas do desenho.",
          "Textos e cotas compatíveis com a escala.",
          "Indicação do nome e área dos ambientes.",
          "Indicação do pé-direito dos ambientes e inclinação.",
          "Diferenciação de laje e forro através de hachuras.",
          "Quadro de Legendas das hachuras.",
          "Tipo de forro (gesso, mineral, perfurado) e acabamento (junta perimétrica, sanca)."
        ]
      }
    ];

    let currentPage = 1;
    let savedState = JSON.parse(localStorage.getItem('executivo_checklist_state') || '{}');

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      const filteredStages = stages.filter(s => s.page === currentPage);

      filteredStages.forEach(stage => {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'card-container';

        let itemsHtml = stage.items.map((item, index) => {
          const itemId = `s${stage.id}_i${index}`;
          const isChecked = savedState[itemId] ? 'checked' : '';
          return `
            <div class="checklist-item">
              <input type="checkbox" id="${itemId}" ${isChecked} onchange="toggleItem('${itemId}')">
              <label for="${itemId}">${index + 1}. ${item}</label>
            </div>
          `;
        }).join('');

        cardContainer.innerHTML = `
          <div class="card" id="card-${stage.id}">
            <div class="card-front">
              <div class="card-front-content">
                <span class="card-step-badge">Etapa 0${stage.id}</span>
                <h3>${stage.title.split('·')[1] || stage.title}</h3>
                <p style="margin-top:8px;">${stage.items.length} itens no checklist</p>
              </div>
              <button class="btn-flip" onclick="flipCard(${stage.id})">Consultar checklist no verso</button>
            </div>
            <div class="card-back">
              <div class="card-back-header">
                <span class="card-back-title">Etapa 0${stage.id} · ${stage.items.length} itens</span>
                <button class="btn-back" onclick="flipCard(${stage.id})">↶ Voltar à capa</button>
              </div>
              <div class="card-back-body">
                ${itemsHtml}
              </div>
            </div>
          </div>
        `;
        container.appendChild(cardContainer);
      });

      // Atualiza Navegação
      document.getElementById('page-title').innerText = `Etapas ${currentPage * 3 - 2}–${currentPage * 3}`;
      document.getElementById('page-indicator').innerText = `Página ${currentPage} de 3`;
      document.getElementById('btn-prev').disabled = currentPage === 1;
      document.getElementById('btn-next').disabled = currentPage === 3;

      updateProgress();
    }

    function flipCard(stageId) {
      const card = document.getElementById(`card-${stageId}`);
      if (card) card.classList.toggle('flipped');
    }

    function toggleItem(itemId) {
      const checkbox = document.getElementById(itemId);
      if (checkbox.checked) {
        savedState[itemId] = true;
      } else {
        delete savedState[itemId];
      }
      localStorage.setItem('executivo_checklist_state', JSON.stringify(savedState));
      updateProgress();
    }

    function updateProgress() {
      const totalItems = 105;
      const checkedCount = Object.keys(savedState).length;
      const percentage = Math.round((checkedCount / totalItems) * 100);

      document.getElementById('completed-count').innerText = checkedCount;
      document.getElementById('percentage-text').innerText = `${percentage}%`;
      document.getElementById('progress-bar').style.width = `${percentage}%`;
    }

    function changePage(direction) {
      currentPage += direction;
      renderCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetChecklist() {
      if (confirm("Tem certeza que deseja limpar todas as marcações?")) {
        savedState = {};
        localStorage.removeItem('executivo_checklist_state');
        renderCards();
      }
    }

    // Inicialização
    renderCards();
  </script>
</body>
</html>
